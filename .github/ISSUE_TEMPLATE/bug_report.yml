name: Bug report
description: Report reproducible gameplay, interface, or build behaviour.
title: 'bug: '
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behaviour and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start a run with seed ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: seed
    attributes:
      label: Run seed
      description: Include the seed when the issue occurs during a run.
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Firefox 128 on Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, console output, or other useful details.
